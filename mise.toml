# mise is the canonical entry point for generating and checking the bundled
# Tree-sitter WebAssembly artifact. The build task delegates compiler work to
# Docker, so the host only needs Go, mise, and Docker; Zig/wasi-sdk are not
# needed.

[tasks.wasm-build]
description = "Build the bundled Tree-sitter WASM artifact in Docker"
run = "go run ./cmd/wasitter-build build-wasm"

[tasks.wasm-verify]
description = "Verify the checked-in WASM artifact and its SHA-256 digest"
run = "go run ./cmd/wasitter-build verify-wasm"

[tasks.wasm-check]
description = "Build WASM in Docker, refresh its digest, and run fixture checks"
depends = ["wasm-build"]
run = "go run ./cmd/wasitter-build verify-wasm && go test ./... -run 'TestBuiltinJSONWASMExportsRequiredABI|TestJSONParseMatchesNativeSExpressions|TestLanguageMetadata' -count=1"

[tasks."build:grammar"]
description = "Build one pinned official Tree-sitter grammar in Docker"
usage = 'arg "<language>" help="official grammar name, for example javascript"'
run = 'go run ./cmd/wasitter-build build-grammar "${usage_language?}"'

[tasks."test:grammar"]
description = "Test generated grammar artifacts and run available parity checks"
usage = 'arg "<language>" help="official grammar name, for example javascript"'
run = 'go run ./cmd/wasitter-build test-grammar "${usage_language?}" && go test ./... -run "TestGeneratedGrammarWASM/${usage_language?}" -count=1 && cd comparison && CGO_ENABLED=1 go test -run "TestGrammarParity/${usage_language?}" -count=1 .'

[tasks."check:grammar"]
description = "Build one grammar and run its WASM/native checks"
usage = 'arg "<language>" help="official grammar name, for example javascript"'
run = 'go run ./cmd/wasitter-build check-grammar "${usage_language?}" && go test ./... -run "TestGeneratedGrammarWASM/${usage_language?}" -count=1 && cd comparison && CGO_ENABLED=1 go test -run "TestGrammarParity/${usage_language?}" -count=1 .'

[tasks.native-test]
description = "Run the CGO native parity suite"
run = "cd comparison && CGO_ENABLED=1 go test ./..."

[tasks.native-bench]
description = "Run the CGO native benchmark suite"
run = "cd comparison && CGO_ENABLED=1 go test -run '^$' -bench . -benchmem"

[tasks.native-bench-smoke]
description = "Run each native comparison benchmark once to check it executes"
run = "cd comparison && CGO_ENABLED=1 go test -run '^$' -bench . -benchtime=1x -benchmem"

[tasks."release:build"]
description = "Build all pinned grammars and export their licenses into a fresh staging directory"
run = "go run ./cmd/wasitter-build build-grammars"

[tasks."release:check"]
description = "Check all staged release grammars against WASM fixtures and native bindings"
run = '''
set -eu
WASITTER_GRAMMAR_DIR="$PWD/.tmp/release/grammars" go test . -run '^TestGeneratedGrammarWASM$' -count=1
cd comparison
WASITTER_GRAMMAR_DIR="$PWD/../.tmp/release/grammars" CGO_ENABLED=1 go test . -run '^TestGrammarParity$' -count=1
'''

[tasks."release:prepare"]
description = "Prepare individual WASM release assets, checksums, and license notices"
run = 'go run ./cmd/wasitter-build prepare-grammar-assets'
